name: Abaixar somente campo Usuario
on:
  push:
    paths:
      - '.github/scripts/abaixar_usuario.py'
permissions:
  contents: write
jobs:
  ajuste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajuste
        run: python .github/scripts/abaixar_usuario.py
      - name: Validar Python
        run: python -m py_compile app_mrp.py
      - name: Commitar e limpar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Abaixar somente campo Usuario em 40px'
          git rm .github/scripts/abaixar_usuario.py .github/workflows/abaixar-usuario.yml
          git commit -m 'Remover arquivos temporarios do ajuste de usuario'
          git push

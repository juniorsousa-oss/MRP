name: Ajustar cabecalho - logo central

on:
  push:
    paths:
      - '.github/scripts/ajustar_cabecalho_logo_central.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar ajuste
        run: python .github/scripts/ajustar_cabecalho_logo_central.py
      - name: Validar sintaxe
        run: python -m py_compile app_mrp.py
      - name: Gravar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_mrp.py
          git diff --cached --quiet && exit 0
          git commit -m "Centralizar logo e remover titulo do cabecalho"
          git push
      - name: Limpar arquivos temporarios
        if: success()
        run: |
          rm -f .github/scripts/ajustar_cabecalho_logo_central.py .github/workflows/ajustar-cabecalho-logo-central.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Limpar arquivos temporarios do ajuste visual"
          git push

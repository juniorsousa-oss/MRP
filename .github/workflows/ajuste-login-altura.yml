name: Correcao isolada Demanda por Projeto
on:
  push:
    paths:
      - '.github/mrp_demanda_fix.trigger'
permissions:
  contents: write
jobs:
  ajuste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir somente os merges de Projeto + Produto
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          old='demanda_projeto_base=demanda_projeto_base.merge(ultima_solicitacao,on="Projeto",how="left"); demanda_projeto_base=demanda_projeto_base.merge(data_cm_projeto,on="Projeto",how="left")'
          new='demanda_projeto_base=demanda_projeto_base.merge(ultima_solicitacao,on=["Projeto","Produto"],how="left"); demanda_projeto_base=demanda_projeto_base.merge(data_cm_projeto,on=["Projeto","Produto"],how="left")'
          if old not in s:
              raise SystemExit('Trecho exato dos merges nao encontrado; nenhuma alteracao foi aplicada.')
          if s.count(old) != 1:
              raise SystemExit('Trecho dos merges encontrado mais de uma vez; nenhuma alteracao foi aplicada.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar Python
        run: python -m py_compile app_mrp.py
      - name: Commitar correcao e remover temporarios
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Corrigir vinculo de datas por projeto e produto'
          git rm .github/mrp_demanda_fix.trigger .github/workflows/ajuste-login-altura.yml
          git commit -m 'Remover arquivos temporarios da correcao'
          git push
name: Ajustar login para referencia visual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ajuste-login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar layout exato da referencia
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app_mrp.py')
          s = p.read_text(encoding='utf-8')

          new_func = r'''def _require_login(login_cfg):
              if st.session_state.get("auth_access_token") and st.session_state.get("auth_role") in {"ADMIN", "CONSULTA"}:
                  return True
              primary = str(login_cfg.get("color_primary") or LOGIN_DEFAULT_CONFIG["color_primary"])
              title_color = str(login_cfg.get("color_title") or LOGIN_DEFAULT_CONFIG["color_title"])
              background = str(login_cfg.get("color_background") or LOGIN_DEFAULT_CONFIG["color_background"])
              text = str(login_cfg.get("color_text") or LOGIN_DEFAULT_CONFIG["color_text"])
              app_title = str(login_cfg.get("app_title") or LOGIN_DEFAULT_CONFIG["app_title"])
              objective = str(login_cfg.get("objective") or LOGIN_DEFAULT_CONFIG["objective"])
              image = str(login_cfg.get("login_image_data") or "")
              image_html = (
                  f'<div class="setta-login-logo"><img src="{image}" /></div>'
                  if image else
                  '<div class="setta-login-logo setta-login-logo-empty"><div>Setta</div></div>'
              )

              st.markdown(f"""
              <style>
                .stApp {{
                  background: #ffffff !important;
                  color: {text} !important;
                }}
                [data-testid="stHeader"], [data-testid="stToolbar"], [data-testid="stSidebar"] {{
                  display: none !important;
                }}
                .block-container {{
                  max-width: 100% !important;
                  min-height: 100vh !important;
                  padding: 0 !important;
                  display: flex !important;
                  flex-direction: column !important;
                  align-items: center !important;
                  justify-content: center !important;
                }}
                .setta-login-top {{
                  width: 286px !important;
                  height: 260px !important;
                  box-sizing: border-box !important;
                  margin: 0 auto !important;
                  padding: 42px 22px 0 !important;
                  background: #ffffff !important;
                  border: 1px solid rgba(0,0,0,.12) !important;
                  border-bottom: 0 !important;
                  border-radius: 28px 28px 0 0 !important;
                  box-shadow: 0 16px 38px rgba(0,0,0,.14) !important;
                  text-align: center !important;
                }}
                .setta-login-logo {{
                  width: 100% !important;
                  height: 105px !important;
                  display: flex !important;
                  align-items: center !important;
                  justify-content: center !important;
                  overflow: hidden !important;
                }}
                .setta-login-logo img {{
                  width: auto !important;
                  max-width: 185px !important;
                  height: auto !important;
                  max-height: 78px !important;
                  object-fit: contain !important;
                  object-position: center !important;
                  display: block !important;
                }}
                .setta-login-logo-empty div {{
                  font-size: 3.4rem !important;
                  font-weight: 800 !important;
                  font-style: italic !important;
                  line-height: 1 !important;
                  color: #111111 !important;
                }}
                .setta-login-title {{
                  margin: 0 !important;
                  padding: 0 !important;
                  color: #111111 !important;
                  font-size: 14px !important;
                  line-height: 17px !important;
                  font-weight: 800 !important;
                }}
                .setta-login-subtitle {{
                  margin: 7px auto 0 !important;
                  max-width: 205px !important;
                  color: #777777 !important;
                  font-size: 6.5px !important;
                  line-height: 9px !important;
                  font-weight: 400 !important;
                }}
                div[data-testid="stForm"] {{
                  width: 286px !important;
                  box-sizing: border-box !important;
                  margin: 0 auto !important;
                  padding: 0 22px 25px !important;
                  background: #ffffff !important;
                  border: 1px solid rgba(0,0,0,.12) !important;
                  border-top: 0 !important;
                  border-radius: 0 0 28px 28px !important;
                  box-shadow: 0 16px 38px rgba(0,0,0,.14) !important;
                }}
                div[data-testid="stForm"] label {{
                  color: #202020 !important;
                  font-size: 9px !important;
                  line-height: 12px !important;
                  font-weight: 600 !important;
                  margin-bottom: 2px !important;
                }}
                div[data-testid="stForm"] [data-testid="stTextInput"] {{
                  margin-bottom: 7px !important;
                }}
                div[data-testid="stForm"] input {{
                  height: 29px !important;
                  min-height: 29px !important;
                  box-sizing: border-box !important;
                  padding: 0 10px !important;
                  border-radius: 6px !important;
                  border: 1px solid #d8dde5 !important;
                  background: #f0f2f6 !important;
                  color: #202020 !important;
                  font-size: 8px !important;
                }}
                div[data-testid="stForm"] input::placeholder {{
                  color: #a6adb8 !important;
                  opacity: 1 !important;
                }}
                div[data-testid="stForm"] input:focus {{
                  border-color: #b8bec8 !important;
                  box-shadow: none !important;
                }}
                div[data-testid="stForm"] button {{
                  height: 29px !important;
                  min-height: 29px !important;
                  margin-top: 3px !important;
                  border-radius: 7px !important;
                  background: #050505 !important;
                  border: 1px solid #050505 !important;
                  color: #ffffff !important;
                  font-size: 8px !important;
                  font-weight: 700 !important;
                  letter-spacing: .02em !important;
                }}
                div[data-testid="stForm"] button:hover {{
                  background: #171717 !important;
                  border-color: #171717 !important;
                }}
                .setta-login-top + div {{
                  margin-top: 0 !important;
                }}
                div[data-testid="stMarkdownContainer"] p:empty {{
                  display: none !important;
                }}
                @media (max-width: 480px) {{
                  .setta-login-top, div[data-testid="stForm"] {{
                    width: 286px !important;
                  }}
                }}
              </style>
              <div class="setta-login-top">
                {image_html}
                <div class="setta-login-title">{app_title}</div>
                <div class="setta-login-subtitle">{objective}</div>
              </div>
              """, unsafe_allow_html=True)

              with st.form("login_form", clear_on_submit=False):
                  usuario = st.text_input("Usuário", placeholder="Digite seu usuário")
                  password = st.text_input("Senha", type="password", placeholder="Digite sua senha")
                  entrar = st.form_submit_button("ENTRAR", use_container_width=True)
              if entrar:
                  usuario = usuario.strip().lower()
                  email_map = {
                      "almoxsetta": "almoxarifado.energy@gruposetta.com",
                      "consulta": "consulta.mrp@gruposetta.com",
                  }
                  email = email_map.get(usuario, usuario)
                  if not usuario or not password:
                      st.error("Informe usuário e senha.")
                  else:
                      try:
                          auth = _login_supabase(email, password)
                          user = auth.get("user") or {}
                          token = auth.get("access_token")
                          role = _load_my_role(token, user.get("id")) if token and user.get("id") else None
                          if not role or role.get("role") not in {"ADMIN", "CONSULTA"}:
                              st.error("Usuário autenticado, mas sem perfil autorizado no MRP.")
                          else:
                              st.session_state["auth_access_token"] = token
                              st.session_state["auth_refresh_token"] = auth.get("refresh_token")
                              st.session_state["auth_user_id"] = user.get("id")
                              st.session_state["auth_email"] = user.get("email", email.strip())
                              st.session_state["auth_nome"] = role.get("nome") or user.get("email", "")
                              st.session_state["auth_role"] = role.get("role")
                              st.rerun()
                      except Exception as e:
                          st.error(f"Não foi possível entrar: {e}")
              return False

          '''

          pattern = r'def _require_login\(login_cfg\):.*?\nPUBLIC_LOGIN_CONFIG = _public_login_config\(\)'
          replacement = new_func + 'PUBLIC_LOGIN_CONFIG = _public_login_config()'
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Bloco _require_login não encontrado: {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Validar Python
        run: python -m py_compile app_mrp.py

      - name: Commitar alteracao e remover workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_mrp.py
          git commit -m "Ajustar tela de login conforme referencia" || true
          git rm .github/workflows/ajuste-login-referencia.yml
          git commit -m "Remover workflow temporario de ajuste do login"
          git push

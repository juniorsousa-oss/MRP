name: Apply CONSULTA purchases patch
on:
  push:
    paths:
      - 'patch_compras_consulta.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Apply and validate
        run: |
          python patch_compras_consulta.py
          python -m py_compile app_mrp.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git rm patch_compras_consulta.py .github/workflows/apply-compras-consulta.yml
          git commit -m 'fix: show purchases in CONSULTA detail'
          git push

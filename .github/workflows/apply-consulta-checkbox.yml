name: Apply CONSULTA checkbox
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply and validate
        run: |
          python patch_consulta_checkbox.py
          python -m py_compile app_mrp.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git rm -f patch_consulta_checkbox.py .github/workflows/apply-consulta-checkbox.yml
          git commit -m 'fix: restore CONSULTA material checkbox selection'
          git push

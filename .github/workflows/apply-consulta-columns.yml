name: Apply CONSULTA fixed columns

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch and validate
        run: |
          python patch_consulta_colunas.py
          python -m py_compile app_mrp.py
      - name: Commit patch and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git rm -f patch_consulta_colunas.py new_render_consulta.txt .github/workflows/apply-consulta-columns.yml
          git commit -m 'fix: lock CONSULTA tables to ADMIN column order'
          git push

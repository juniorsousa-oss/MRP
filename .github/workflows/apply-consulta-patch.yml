name: Apply CONSULTA patch
on:
  push:
    paths:
      - 'patch_consulta.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python patch_consulta.py
          python -m py_compile app_mrp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git commit -m 'fix: restore CONSULTA query and export access'
          git push

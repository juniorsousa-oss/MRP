name: Apply CONSULTA patch
on:
  push:
    paths:
      - '.github/workflows/apply-consulta-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore patch script from known-good commit
        run: git checkout ac2994eb0af342876abdc19c01bae8e87d18727c -- patch_consulta.py
      - name: Apply patch
        run: |
          python patch_consulta.py
          python -m py_compile app_mrp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git commit -m 'fix: restore CONSULTA query and export access'
          git push

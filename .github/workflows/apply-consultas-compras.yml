name: Apply compras consultation patch
on:
  push:
    paths:
      - 'patch_consultas_compras.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch and validate
        run: |
          python patch_consultas_compras.py
          python -m py_compile app_mrp.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git commit -m 'fix: show compras in consulta' || true
          git push
          git rm patch_consultas_compras.py .github/workflows/apply-consultas-compras.yml || true
          git commit -m 'chore: remove temporary compras patch files' || true
          git push

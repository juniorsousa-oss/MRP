name: Apply snapshot UI fix
on:
  push:
    paths:
      - 'patch_snapshot_ui.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Apply and validate
        run: |
          python patch_snapshot_ui.py
          python -m py_compile app_mrp.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git rm patch_snapshot_ui.py .github/workflows/apply_snapshot_ui.yml
          git commit -m 'fix: preserve full MRP UI on snapshot refresh'
          git push

name: Apply visual refinement
on:
  push:
    paths:
      - 'patch_visual_refinement.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Apply and validate visual refinement
        run: |
          python patch_visual_refinement.py
          python -m py_compile app_mrp.py
      - name: Commit changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git rm patch_visual_refinement.py .github/workflows/apply_visual_refinement.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: add admin visual configuration'
          git push

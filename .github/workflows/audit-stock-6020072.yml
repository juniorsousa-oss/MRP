name: Auditar saldo 6020072
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_stock_6020072.py'
      - '.github/workflows/audit-stock-6020072.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências MRP
        run: pip install -r requirements.txt openpyxl
      - name: Ler fonte original e bases derivadas (somente material solicitado)
        run: python -m scripts.audit_stock_6020072

name: Check login final
on:
  push:
    paths:
      - '.github/workflows/check-login-final.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f app_mrp.py
      - run: python -m py_compile app_mrp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/check-login-final.yml || true
          git commit -m 'Remover workflow temporario de verificacao' || true
          git push

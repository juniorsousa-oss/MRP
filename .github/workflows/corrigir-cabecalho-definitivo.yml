name: Corrigir cabecalho definitivo

on:
  push:
    paths:
      - '.github/scripts/corrigir_cabecalho_definitivo.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar correcao
        run: python .github/scripts/corrigir_cabecalho_definitivo.py
      - name: Validar sintaxe
        run: python -m py_compile app_mrp.py
      - name: Gravar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_mrp.py
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir balão e centralizar logo"
          git push

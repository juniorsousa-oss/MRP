name: Corrigir sintaxe do login
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar favicon preto
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          old='st.set_page_config(page_title="MRP | SETTA", page_icon="https://www.settaenergia.com.br/assets/logofootter2.svg", layout="wide")'
          new='st.set_page_config(page_title="MRP | SETTA", page_icon="assets/mrp_setta_icon.svg", layout="wide")'
          if old not in s:
              raise SystemExit('Configuração atual do favicon não encontrada.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile app_mrp.py
      - name: Commitar alteração e remover workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Usar favicon preto no MRP | SETTA'
          git rm .github/workflows/corrigir-login-sintaxe.yml
          git commit -m 'Remover workflow temporario do favicon'
          git push

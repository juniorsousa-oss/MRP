name: Final login layout
on:
  push:
    paths:
      - '.github/workflows/final-login-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_login_positions.py
      - run: python -m py_compile app_mrp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Finalizar layout centralizado do login' || true
          git rm .github/workflows/final-login-layout.yml .github/scripts/fix_login_positions.py
          git commit -m 'Limpar arquivos temporarios do login' || true
          git push

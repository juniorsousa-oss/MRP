name: Finalize MRP auth gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Finalize MRP authentication gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix gate position
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          gate='if not _require_login():\n    st.stop()\n\n'
          s=s.replace(gate,'',1)
          marker='    return False\n\ndef _sb_headers():'
          if marker not in s:
              raise SystemExit('Auth function marker not found')
          s=s.replace(marker,'    return False\n\n'+gate+'def _sb_headers():',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_mrp.py
          git diff --cached --quiet && exit 0
          git commit -m "Finalize MRP authentication gate"
          git push

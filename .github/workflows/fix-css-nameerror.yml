name: Fix CSS NameError

on:
  push:
    paths:
      - '.github/workflows/fix-css-nameerror.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CSS braces and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app_mrp.py')
          s = p.read_text(encoding='utf-8')
          old = '.setta-main-description { margin-top: -10px; margin-bottom: 12px; color: var(--setta-text); opacity: .78; font-size: .9rem; }'
          new = '.setta-main-description {{ margin-top: -10px; margin-bottom: 12px; color: var(--setta-text); opacity: .78; font-size: .9rem; }}'
          if old not in s:
              raise SystemExit('CSS marker not found; refusing to modify unrelated code.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile app_mrp.py
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py .github/workflows/fix-css-nameerror.yml
          git commit -m 'Fix CSS braces in visual theme'
          git rm .github/workflows/fix-css-nameerror.yml
          git commit -m 'Remove temporary CSS fix workflow'
          git push

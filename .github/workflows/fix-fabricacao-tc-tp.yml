name: Corrigir fabricação TC TP

on:
  push:
    paths:
      - '.github/scripts/fix_fabricacao_tc_tp.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        run: python .github/scripts/fix_fabricacao_tc_tp.py

      - name: Validar sintaxe
        run: python -m py_compile app_mrp.py

      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git commit -m 'Corrige saldo em fabricação de TC e TP' || echo 'Nada para commitar'
          git push

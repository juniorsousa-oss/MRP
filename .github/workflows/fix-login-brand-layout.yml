name: Corrigir layout da marca no login

on:
  push:
    paths:
      - '.github/scripts/fix_login_brand_layout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        run: python .github/scripts/fix_login_brand_layout.py
      - name: Validar sintaxe
        run: python -m py_compile app_mrp.py
      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_mrp.py
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir logo e remover textos do balão de login"
          git push

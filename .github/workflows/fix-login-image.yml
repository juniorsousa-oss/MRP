name: Fix login image sizing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust login image scaling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app_mrp.py')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('"login_image_height": 135,', '"login_image_height": 110,'),
            ('image_height = max(100, min(240, int(login_cfg.get("login_image_height") or 135)))', 'image_height = max(80, min(200, int(login_cfg.get("login_image_height") or 110)))'),
            ('.setta-login-image {{ height: {image_height}px; overflow: hidden; background: linear-gradient(135deg, {primary}, {title_color}); }}', '.setta-login-image {{ height: {image_height}px; overflow: hidden; background: #ffffff; display:flex; align-items:center; justify-content:center; padding: 6px 18px; box-sizing:border-box; }}'),
            ('.setta-login-image img {{ width: 100%; height: 100%; object-fit: cover; display: block; }}', '.setta-login-image img {{ width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }}'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Marker not found: {old}')
              s = s.replace(old, new, 1)
          # Keep the admin control aligned with the actual range used by the login renderer.
          s = s.replace('min_value=100, max_value=240', 'min_value=80, max_value=200', 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile app_mrp.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git commit -m 'style: fix login image scaling and size control'
          git rm .github/workflows/fix-login-image.yml
          git commit -m 'Remove temporary login image workflow'
          git push

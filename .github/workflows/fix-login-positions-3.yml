name: Ajustar login 3
on:
  push:
    paths:
      - '.github/workflows/fix-login-positions-3.yml'
permissions:
  contents: write
jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_login_positions.py
      - run: python -m py_compile app_mrp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Ajustar conteúdo interno do card de login'
          git rm .github/workflows/fix-login-positions-3.yml .github/scripts/fix_login_positions.py
          git commit -m 'Limpar arquivos temporários do login'
          git push

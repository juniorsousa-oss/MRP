name: Corrigir login para um unico card
on:
  push:
    paths:
      - '.github/scripts/fix_login_single_card.py'
permissions:
  contents: write
jobs:
  fix-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao
        run: python .github/scripts/fix_login_single_card.py
      - name: Validar Python
        run: python -m py_compile app_mrp.py
      - name: Commitar e limpar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Corrigir login para um unico card centralizado'
          git rm .github/workflows/fix-login-single-card.yml .github/scripts/fix_login_single_card.py
          git commit -m 'Remover arquivos temporarios do ajuste do login'
          git push

name: Fix MRP demand rule

on:
  push:
    paths:
      - 'app_mrp.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply demand rule
        shell: python
        run: |
          from pathlib import Path
          p = Path('app_mrp.py')
          s = p.read_text(encoding='utf-8')

          old = '''sa_week = rg_mrp[rg_mrp["Código"].isin(codigos_ii)].groupby(\n    ["Código", "Semana"], as_index=False\n)["Pendência"].sum().rename(columns={"Pendência": "Demanda S.A."})'''
          new = '''sa_week = rg_mrp.groupby(\n    ["Código", "Semana"], as_index=False\n)["Pendência"].sum().rename(columns={"Pendência": "Demanda S.A."})'''
          if old not in s:
              raise SystemExit('Bloco sa_week não encontrado')
          s = s.replace(old, new)

          old = '''tc_rows = mt[(mt["Material"] > 0) & mt["Semana Necessidade"].between(1, 53)]\ntc_rows = tc_rows[tc_rows["Material"].isin(codigos_ii)]'''
          new = '''tc_rows = mt[(mt["Material"] > 0) & mt["Semana Necessidade"].between(1, 53)]'''
          if old not in s:
              raise SystemExit('Bloco tc_rows não encontrado')
          s = s.replace(old, new)

          old = '''macro["Demanda"] = macro["Demanda S.A."] + macro["Demanda TC/TP"]\nmacro["DIV"] = ('''
          new = '''macro["Demanda"] = macro["Demanda S.A."] + macro["Demanda TC/TP"]\n# Materiais Tipo II aparecem no MRP, mas sua DEMANDA é sempre zero.\nmacro.loc[macro["Tipo"].str.upper().eq("II"), "Demanda"] = 0.0\nmacro["DIV"] = ('''
          if old not in s:
              raise SystemExit('Bloco macro demanda não encontrado')
          s = s.replace(old, new)

          old = '''events = events[events["Semana"] >= semana_atual]\nevents = events.groupby(["Código", "Semana"], as_index=False)[["Demanda", "Supply"]].sum()'''
          new = '''events = events[events["Semana"] >= semana_atual]\n# A regra do Tipo II vale também para a projeção semanal: demanda = 0.\nevents.loc[events["Código"].isin(codigos_ii), "Demanda"] = 0.0\nevents = events.groupby(["Código", "Semana"], as_index=False)[["Demanda", "Supply"]].sum()'''
          if old not in s:
              raise SystemExit('Bloco events não encontrado')
          s = s.replace(old, new)

          old = '''demanda_projeto = rg_mrp[rg_mrp["Código"].isin(codigos_ii)][\n    ["Código", "Projeto", "Pendência", "Semana"]\n].rename(columns={"Pendência": "Quantidade"}).sort_values(["Código", "Semana", "Projeto"])'''
          new = '''demanda_projeto = rg_mrp[~rg_mrp["Código"].isin(codigos_ii)][\n    ["Código", "Projeto", "Pendência", "Semana"]\n].rename(columns={"Pendência": "Quantidade"}).sort_values(["Código", "Semana", "Projeto"])'''
          if old not in s:
              raise SystemExit('Bloco demanda_projeto não encontrado')
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-mrp-demand.yml
          git add app_mrp.py .github/workflows/fix-mrp-demand.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix MRP demand rule for Tipo II [skip ci]'
          git push

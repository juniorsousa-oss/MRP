name: Corrigir Produzindo TC TP

on:
  push:
    paths:
      - '.github/scripts/fix_produzindo_tc_tp.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correção
        run: python .github/scripts/fix_produzindo_tc_tp.py

      - name: Validar sintaxe
        run: python -m py_compile app_mrp.py

      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_mrp.py
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir Produzindo TC/TP por OP e produto"
          git push

name: Fix visual refinement import
on:
  push:
    paths:
      - 'patch_visual_import.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Apply and validate
        run: |
          python patch_visual_import.py
          python -m py_compile app_mrp.py
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git rm patch_visual_import.py .github/workflows/fix_visual_import.yml
          git commit -m 'fix: import visual configuration dependencies'
          git push

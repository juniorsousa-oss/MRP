name: Last login patch
on:
  push:
    paths:
      - '.github/workflows/last-login.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_login_positions.py
      - run: python -m py_compile app_mrp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Ajustar conteúdo interno do login' || true
          git rm .github/workflows/last-login.yml .github/scripts/fix_login_positions.py || true
          git commit -m 'Limpar ajuste temporário do login' || true
          git push

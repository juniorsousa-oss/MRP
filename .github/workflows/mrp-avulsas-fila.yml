name: Validar fila de Solicitações Avulsas
on:
  pull_request:
    branches: [main]
    paths: ['app_mrp.py', 'mrp_avulsas_fila*.py', 'scripts/test_mrp_avulsas_browser.py', '.github/workflows/mrp-avulsas-fila.yml']
  workflow_dispatch:
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'playwright>=1.54,<2' pytest
      - run: python -m pytest -q tests
      - run: |
          python -m scripts.test_mrp_avulsas
          python -m scripts.test_mrp_avulsas_fixes
          python -m scripts.test_mrp_avulsas_ux
          python -m scripts.test_mrp_operador_fluxo
          python -m scripts.test_mrp_conferencia_final_admin
          python -m scripts.test_mrp_excecao_reserva
      - run: python -m scripts.test_mrp_avulsas_browser

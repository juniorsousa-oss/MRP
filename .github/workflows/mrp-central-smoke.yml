name: Validar Central MRP

on:
  push:
    branches: [main]
    paths:
      - 'central_mrp_data.py'
      - 'mrp_central_data_patch.py'
      - 'mrp_fabricacao_vinculos.py'
      - 'tests/test_mrp_fabricacao_vinculos.py'
      - 'mrp_compra_validacao_patch.py'
      - 'mrp_compra_preanalise.py'
      - 'tests/test_compra_preanalise_por_op.py'
      - 'mrp_integridade_compra.py'
      - 'mrp_filtros_tratativas_patch.py'
      - 'scripts/test_mrp_auto_integridade.py'
      - 'requirements.txt'
      - '.github/workflows/mrp-central-smoke.yml'
  workflow_dispatch:

jobs:
  central-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testar integridade das descrições e recarga automática
        run: PYTHONPATH=. python scripts/test_mrp_auto_integridade.py
      - name: Testar relatório consultivo de compras por OP
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_compra_preanalise_por_op.py' -v
      - name: Garantir OP programada sem BOM e nenhuma demanda fictícia
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_mrp_fabricacao_vinculos.py' -v
      - name: Ler bases atuais da Central
        run: |
          python - <<'PY'
          import central_mrp_data as central
          from pathlib import Path

          central_source = Path("central_mrp_data.py").read_text(encoding="utf-8")
          assert "allow_legacy_excel: bool = False" in central_source
          assert "O MRP não reabrirá o Excel automaticamente" in central_source
          assert "except Exception:" not in central_source[
              central_source.index("def _download_cadastros_frame_cached"):
              central_source.index("def _download_derived_cached")
          ]

          state = central.inspect_mrp_state(force_check=True)
          assert "signature" in state, state
          assert "state_token" in state, state
          assert "cadastros_frame" not in state, "A checagem leve não pode baixar DataFrames."
          assert all(key not in state for key in central.DERIVED_INPUTS), (
              "A checagem leve não pode materializar bases derivadas."
          )

          bundle = central.load_mrp_bundle()
          assert bundle.get("ready") is True, bundle
          cadastro = bundle.get("cadastros_frame")
          assert cadastro is not None and not cadastro.empty, "cadastros_frame"
          print("cadastros", len(cadastro), list(cadastro.columns)[:5])
          expected = {
              "relatorio_geral_tratado",
              "estoque_tratado",
              "compras_tratado",
              "tctp_tratado",
          }
          for key in expected:
              frame = bundle.get(key)
              assert frame is not None and not frame.empty, key
              print(key, len(frame), list(frame.columns)[:5])
          # Diagnóstico de regressão: OP 26-1120-01 do PMP programada em 18/11.
          # A presença no TCTP significa que o carregador deve preservar a OP,
          # ainda que a estrutura H001 esteja ausente.
          tctp=bundle["tctp_tratado"]
          df=tctp.copy()
          if {"ORDEM DE PRODUÇÃO","CÓDIGO PRODUTO","MATERIAL"}.issubset(df.columns):
              op=df[df["ORDEM DE PRODUÇÃO"].astype(str).str.strip().eq("26-1120-01")]
              print("PMP_OP_26_1120_01_TCTP",len(op),op[
                  ["ORDEM DE PRODUÇÃO","CÓDIGO PRODUTO","MATERIAL"]
              ].head(8).to_dict("records"))
          print("dependency_versions", bundle.get("dependency_versions"))
          print("CENTRAL_MRP_OK")
          PY

name: Conferência Final MRP — Validação Isolada
on:
  push:
    branches: [main]
    paths:
      - 'mrp_avulsas_final_admin_patch.py'
      - 'mrp_avulsas_fluxo_patch.py'
      - 'scripts/test_mrp_garantia_regularizacao.py'
      - 'scripts/test_mrp_garantia_desbloqueio.py'
      - 'scripts/test_mrp_relatorio_realizado_data.py'
      - 'scripts/test_mrp_contadores_sa_materiais.py'
      - 'supabase/migrations/20261021_mrp_conferencia_simplificada.sql'
      - 'supabase/migrations/20261021_mrp_avulsas_garantia_duas_movimentacoes.sql'
      - 'app_mrp.py'
      - 'scripts/test_mrp_conferencia_final_admin.py'
      - 'supabase/functions/mrp-avulsas-api/index.ts'
      - 'supabase/migrations/20261021_mrp_avulsas_conferencia_final_admin.sql'
      - '.github/workflows/mrp-conferencia-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-admin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar compilacao da aplicação final e regras ADMIN
        run: python scripts/test_mrp_conferencia_final_admin.py
      - name: Verificar garantia ASTEC, baixa/retorno e conferência
        run: python scripts/test_mrp_garantia_regularizacao.py
      - name: Testar desbloqueio ASTEC sem documento (SA 000018)
        run: python scripts/test_mrp_garantia_desbloqueio.py
      - name: Verificar status e datas do relatório e Excel
        run: python scripts/test_mrp_relatorio_realizado_data.py
      - name: Verificar contagem por S.A. e materiais
        run: python scripts/test_mrp_contadores_sa_materiais.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar API das solicitações
        run: deno check supabase/functions/mrp-avulsas-api/index.ts

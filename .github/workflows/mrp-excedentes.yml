name: Validar análise de excedentes MRP
on:
  push:
    branches:
      - feat/mrp-excedentes-20261106
      - main
    paths:
      - 'mrp_excedentes.py'
      - 'mrp_excedentes_patch.py'
      - 'app_mrp.py'
      - 'tests/test_mrp_excedentes.py'
      - '.github/workflows/mrp-excedentes.yml'
  pull_request:
    branches: [main]
jobs:
  excedentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências dos testes
        run: python -m pip install "pandas>=2.2,<3" "openpyxl>=3.1,<4"
      - name: Compilar módulos do MRP
        run: python -m compileall -q .
      - name: Validar composição das camadas do MRP
        run: python scripts/validate_generated_mrp.py
      - name: Testar cálculo e proteção dos documentos
        run: python -m unittest discover -s tests -p 'test_mrp_excedentes.py' -v

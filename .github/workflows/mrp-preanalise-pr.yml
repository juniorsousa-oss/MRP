name: Validar pré-análise de compras MRP

on:
  pull_request:
    paths:
      - 'mrp_compra_preanalise.py'
      - 'mrp_abas_sob_demanda_patch.py'
      - 'tests/test_mrp_abas_sob_demanda.py'
      - 'mrp_compra_validacao_patch.py'
      - 'mrp_excedentes_patch.py'
      - 'tests/test_compra_preanalise_por_op.py'
      - 'tests/test_mrp_exportacao_sob_demanda.py'
      - 'tests/test_mrp_preco_carga_inicial.py'
      - 'mrp_engine_headless.py'
      - '.github/workflows/mrp-preanalise-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validar pré-análise sem banco ou envio
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_compra_preanalise_por_op.py' -v
      - name: Validar integração dos patches no runtime
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_mrp_engine_extract.py' -v
      - name: Validar exportação sob demanda na interface
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_mrp_exportacao_sob_demanda.py' -v
      - name: Validar preços na carga inicial
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_mrp_preco_carga_inicial.py' -v
      - name: Validar abas sob demanda e persistência dos filtros
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_mrp_abas_sob_demanda.py' -v

name: Validar menu no navegador

on:
  push:
    branches:
      - main
    paths:
      - 'mrp_setta_ui_v1_patch.py'
      - 'scripts/test_mrp_sidebar_browser.py'
      - '.github/workflows/mrp-sidebar-browser.yml'
  workflow_dispatch:

jobs:
  sidebar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Streamlit e navegador automatizado
        run: |
          python -m pip install 'streamlit==1.55.0' 'playwright>=1.54,<2'
          which google-chrome || which chromium || true
          python -m playwright install --with-deps webkit
      - name: Verificar menu do MRP em desktop e mobile
        run: python -m scripts.test_mrp_sidebar_browser
      - name: Anexar capturas para auditoria visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-menu-mrp
          path: artifacts/sidebar-browser/*.png
          if-no-files-found: ignore

name: Verificar compilacao MRP

on:
  push:
    branches:
      - main
      - fix/mrp-historico-resiliencia-20260923
    paths:
      - 'app_mrp*.py'
      - 'mrp_*patch.py'
      - '.github/workflows/mrp-smoke.yml'

jobs:
  compile-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compilar arquivos e runtime com todos os patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import compileall
          for f in Path(".").glob("*.py"):
              if not compileall.compile_file(str(f), quiet=1):
                  raise SystemExit(f"Arquivo com erro de sintaxe: {f}")
          env = {"__file__": "app_mrp.py", "__name__": "__main__"}
          entry = Path("app_mrp.py").read_text(encoding="utf-8")
          stop_entry = 'exec(compile(_runtime_source, "app_mrp_runtime.py", "exec"), globals(), globals())'
          assert entry.count(stop_entry) == 1
          exec(compile(entry.split(stop_entry)[0], "app_mrp.py", "exec"), env, env)
          runtime = env["_runtime_source"]
          stop_runtime = 'exec(compile(_source, "app_mrp_original.py", "exec"), globals(), globals())'
          assert runtime.count(stop_runtime) == 1
          env["__file__"] = "app_mrp_runtime.py"
          exec(compile(runtime.rsplit(stop_runtime, 1)[0], "app_mrp_runtime.py", "exec"), env, env)
          compile(env["_source"], "app_mrp_original.py", "exec")
          assert "compressed_payload" in env["_source"]
          assert "RECUPERAR HISTÓRICO PELO EXCEL" in env["_source"]
          # Round trip do formato compactado, sem conexão nem escrita no banco.
          import ast, json, re, gzip, base64
          parsed = ast.parse(env["_source"])
          # Valida o motor efetivamente executado no Streamlit, sem banco nem uploads.
          from datetime import date, timedelta
          from types import SimpleNamespace
          semana_defs = [n for n in parsed.body if isinstance(n, ast.FunctionDef)
                         and n.name in {"semana_id", "formatar_semana", "_inicio_semana",
                                        "periodo_semana", "ultimo_dia_util_semana"}]
          assert len(semana_defs) == 5, "Funções da virada de ano não encontradas no runtime"
          semana_scope = {"pd": SimpleNamespace(isna=lambda x: x is None),
                          "date": date, "timedelta": timedelta, "re": re}
          exec(compile(ast.Module(body=semana_defs, type_ignores=[]), "semanas_runtime.py", "exec"),
               semana_scope, semana_scope)
          sid = semana_scope["semana_id"]
          periodo = semana_scope["periodo_semana"]
          sexta = semana_scope["ultimo_dia_util_semana"]
          fmt = semana_scope["formatar_semana"]
          assert [sid(x) for x in ("2026-52", "2027-01", "2027-02", "2030-52")] == [
              202652, 202701, 202702, 203052]
          assert periodo(202652) == "27/12/2026 a 02/01/2027"
          assert periodo(202702) == "10/01/2027 a 16/01/2027"
          assert periodo(203052) == "29/12/2030 a 04/01/2031"
          assert sexta(202702) == "15/01/2027"
          assert fmt(202702) == "2027-02"
          assert sid(0) != sid(0)  # sem semana não é confundido com semana válida
          assert sid("SUSPENSO") != sid("SUSPENSO")
          assert "range(semana_atual,ultima_semana+1)" not in env["_source"]
          print("Virada de ano, período semanal e projeção esparsa: OK")
          compact_fn = next(n for n in parsed.body if isinstance(n, ast.FunctionDef) and n.name == "_mrp_compact_snapshot")
          get_fn = [n for n in parsed.body if isinstance(n, ast.FunctionDef) and n.name == "_sb_get"][-1]
          scope = {"json": json, "re": re, "_mrp_gzip": gzip, "_mrp_b64": base64, "_mrp_compact_fields": ("mrp_geral", "projecao_semanal", "demanda_projeto", "compra_mrp", "compras", "fabricacao")}
          exec(compile(ast.Module(body=[compact_fn, get_fn], type_ignores=[]), "codec.py", "exec"), scope, scope)
          example = {field: [{"Código": 1, "Demanda": 12}] * 120 for field in (
              "mrp_geral", "projecao_semanal", "demanda_projeto", "compra_mrp", "compras", "fabricacao")}
          example.update({"calculation_key": "a" * 64, "semana_mrp": 38, "usuario": "teste"})
          packed = scope["_mrp_compact_snapshot"](example)
          assert set(packed) == {"semana_mrp", "usuario", "calculation_key", "compressed_payload"}
          assert len(packed["compressed_payload"]) < len(json.dumps(example))
          scope["_mrp_uncompressed_get"] = lambda params=None: [dict(id=1, compressed_payload=packed["compressed_payload"])]
          assert all(scope["_sb_get"]()[0][field] == example[field] for field in (
              "mrp_geral", "projecao_semanal", "demanda_projeto", "compra_mrp", "compras", "fabricacao"))
          print("Sintaxe, montagem e leitura do histórico compactado: OK")
          PY

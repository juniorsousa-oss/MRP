name: Aplicar ajuste visual login

on:
  push:
    paths:
      - '.github/scripts/patch_login_visual.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python .github/scripts/patch_login_visual.py
      - name: Validar sintaxe
        run: python -m py_compile app_mrp.py
      - name: Commitar app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git commit -m 'Ajusta visual da tela de login' || echo 'Nada para commitar'
          git push

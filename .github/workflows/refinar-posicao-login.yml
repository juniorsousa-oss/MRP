name: Refinar posicao do conteudo do login
on:
  push:
    paths:
      - '.github/workflows/refinar-posicao-login.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar deslocamento de 5cm
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          old='''      .setta-login-image {{
        width:100% !important; height:135px !important; overflow:hidden !important; background:transparent !important;'''
          new='''      .setta-login-image {{
        transform:translateY(-5cm) !important;
        width:100% !important; height:135px !important; overflow:hidden !important; background:transparent !important;'''
          if old not in s: raise SystemExit('Bloco da imagem nao encontrado')
          s=s.replace(old,new,1)
          old='''      .setta-login-heading {{ text-align:center !important; padding:0 20px !important; height:58px !important; box-sizing:border-box !important; }}'''
          new='''      .setta-login-heading {{ transform:translateY(-5cm) !important; text-align:center !important; padding:0 20px !important; height:58px !important; box-sizing:border-box !important; }}'''
          if old not in s: raise SystemExit('Bloco do heading nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile app_mrp.py
      - name: Commitar e remover
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Subir conteudo do login em 5cm mantendo cartao'
          git rm .github/workflows/refinar-posicao-login.yml
          git commit -m 'Remover workflow temporario'
          git push

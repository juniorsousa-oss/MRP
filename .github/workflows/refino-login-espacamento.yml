name: Refinar espacamento do login
on:
  push:
    paths:
      - '.github/workflows/refino-login-espacamento.yml'
permissions:
  contents: write
jobs:
  ajuste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar dimensoes e espacamentos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          reps={
          'width:286px !important; height:418px !important;':'width:286px !important; height:390px !important;',
          'height:145px !important; overflow:hidden !important;':'height:135px !important; overflow:hidden !important;',
          'max-width:175px !important; max-height:82px !important;':'max-width:165px !important; max-height:76px !important;',
          'height:62px !important; box-sizing:border-box !important;':'height:58px !important; box-sizing:border-box !important;',
          'top:calc(50% + 2px) !important;':'top:calc(50% + 4px) !important;',
          'height:175px !important; margin:0 !important; padding:0 22px 18px !important;':'height:170px !important; margin:0 !important; padding:0 20px 14px !important;',
          'padding:0 22px !important;':'padding:0 20px !important;',
          'top:-18px !important;':'top:-4px !important;',
          'height:29px !important; min-height:29px !important; margin-top:3px !important;':'height:29px !important; min-height:29px !important; margin-top:2px !important;',
          'margin-bottom:7px !important;':'margin-bottom:8px !important;'
          }
          for a,b in reps.items():
              if a not in s: print('AVISO alvo ausente:',a)
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python -m py_compile app_mrp.py
      - name: Commitar e limpar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Refinar dimensoes e espacamento do login'
          git rm .github/workflows/refino-login-espacamento.yml
          git commit -m 'Remover workflow temporario do login'
          git push

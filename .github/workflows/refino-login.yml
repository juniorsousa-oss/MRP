name: Refinar login
on:
  push:
    paths:
      - '.github/workflows/refino-login.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refinar posicionamento do botao
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          old='''      div[data-testid="stForm"] button {{\n        height:29px !important; min-height:29px !important; margin-top:3px !important; border-radius:7px !important;'''
          new='''      div[data-testid="stForm"] button {{\n        position:relative !important; top:-18px !important;\n        height:29px !important; min-height:29px !important; margin-top:3px !important; border-radius:7px !important;'''
          if old not in s: raise SystemExit('CSS do botao nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: python -m py_compile app_mrp.py
      - name: Commitar e limpar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'Refinar espacamento do botao no login'
          git rm .github/workflows/refino-login.yml
          git commit -m 'Remover workflow temporario do refino do login'
          git push

name: Restore MRP app
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-mrp-auth.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good app and patch login
        run: |
          git checkout c2bda6c266aeb2df319f8a2b459e99902eb28874 -- app_mrp.py
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          old='''    with st.form("login_form", clear_on_submit=False):\n        email = st.text_input("E-mail")\n        password = st.text_input("Senha", type="password")\n        entrar = st.form_submit_button("ENTRAR", use_container_width=True)\n    if entrar:\n        if not email.strip() or not password:\n            st.error("Informe e-mail e senha.")\n        else:\n            try:\n                auth = _login_supabase(email.strip(), password)'''
          new='''    with st.form("login_form", clear_on_submit=False):\n        usuario = st.text_input("Usuário")\n        password = st.text_input("Senha", type="password")\n        entrar = st.form_submit_button("ENTRAR", use_container_width=True)\n    if entrar:\n        usuario = usuario.strip().lower()\n        email_map = {\n            "almoxsetta": "almoxarifado.energy@gruposetta.com",\n            "consulta": "consulta.mrp@gruposetta.com",\n        }\n        email = email_map.get(usuario, usuario)\n        if not usuario or not password:\n            st.error("Informe usuário e senha.")\n        else:\n            try:\n                auth = _login_supabase(email, password)'''
          if old not in s:
              raise SystemExit('Bloco de login esperado não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_mrp.py
          git commit -m 'fix: restore full MRP app and use created auth users'
          git push

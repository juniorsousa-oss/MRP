name: Set browser favicon
on:
  push:
    paths:
      - '.github/workflows/set-favicon.yml'
permissions:
  contents: write
jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Setta favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app_mrp.py')
          s=p.read_text(encoding='utf-8')
          old='st.set_page_config(page_title="MRP | SETTA", page_icon="📦", layout="wide")'
          new='st.set_page_config(page_title="MRP | SETTA", page_icon="https://www.settaenergia.com.br/assets/logofootter2.svg", layout="wide")'
          if old not in s: raise SystemExit('page config marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile app_mrp.py
      - name: Commit and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app_mrp.py
          git commit -m 'style: set Setta logo as browser favicon'
          git rm .github/workflows/set-favicon.yml
          git commit -m 'Remove temporary favicon workflow'
          git push

name: Validar MRP SETTA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar módulos e patches
        run: python -m compileall -q .
      - name: Montar aplicação final
        run: python scripts/validate_generated_mrp.py
      - name: Testar etapas e permissões das solicitações avulsas
        run: python -m scripts.test_mrp_avulsas
      - name: Testar recusa, liberação de reserva e bloqueio do Enter
        run: python -m scripts.test_mrp_avulsas_recusa
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testar regras de saldo, sobra, reservas e status
        run: deno test supabase/functions/mrp-avulsas-api/catalog_test.ts
      - name: Verificar compilação da API de solicitações
        run: deno check supabase/functions/mrp-avulsas-api/index.ts

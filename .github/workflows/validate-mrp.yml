name: Validar MRP SETTA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar módulos e patches
        run: python -m compileall -q .
      - name: Montar aplicação final
        run: python scripts/validate_generated_mrp.py

name: Validar MRP SETTA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar módulos e patches
        run: python -m compileall -q .
      - name: Montar aplicação final
        run: python scripts/validate_generated_mrp.py
      - name: Validar responsividade mobile SETTA
        run: python -m scripts.test_mrp_mobile_layout
      - name: Validar menu desktop, mobile e navegação
        run: python -m scripts.test_mrp_sidebar_visibility
      - name: Validar status ATENÇÃO e reprocessamento do Relatório MRP
        run: python -m scripts.test_mrp_status_geral
      - name: Preparar pandas para validar compras
        run: python -m pip install "pandas>=2.2,<3" "openpyxl>=3.1,<4"
      - name: Testar layout CSV Protheus e prioridade da Compra MRP
        run: python -m scripts.test_compra_mrp
      - name: Testar etapas e permissões das solicitações avulsas
        run: python -m scripts.test_mrp_avulsas
      - name: Testar recusa, liberação de reserva e bloqueio do Enter
        run: python -m scripts.test_mrp_avulsas_recusa
      - name: Testar hierarquia de perfis CONSULTA OPERADOR ADMIN
        run: python -m scripts.test_mrp_perfis
      - name: Testar UX das solicitações e datas do acompanhamento
        run: python -m scripts.test_mrp_avulsas_ux
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testar regras de saldo, sobra, reservas e status
        run: deno test supabase/functions/mrp-avulsas-api/catalog_test.ts
      - name: Validar condicao de garantia e avisos temporarios
        run: python -m scripts.test_mrp_garantia_status
      - name: Validar subtabs de garantias pendentes e confirmadas
        run: python -m scripts.test_mrp_garantia_abas
      - name: Verificar contrato de notificações por e-mail
        run: python -m scripts.test_mrp_email_config
      - name: Testar separacao e entrega do operador por S.A.
        run: python -m scripts.test_mrp_operador_fluxo
      - name: Testar numeracao, status e custos nas solicitacoes
        run: python -m scripts.test_mrp_avulsas_fixes
      - name: Testar referencia de custos no CADASTROS
        run: deno test supabase/functions/mrp-avulsas-api/custos_test.ts
      - name: Testar emails de separação e entrega
        run: deno test supabase/functions/mrp-avulsas-api/email_test.ts
      - name: Verificar compilação da API de solicitações
        run: deno check supabase/functions/mrp-avulsas-api/index.ts
